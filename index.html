<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamada de Rescate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- PANTALLA 1: ENTRADA -->
    <section id="inicio" aria-labelledby="titulo">
      <header>
        <h1 id="titulo">🚨 Llamada de Rescate</h1>
        <p class="sub">¿Atrapado/a en un lugar del que no te podés ir sin quedar mal?</p>
      </header>

      <fieldset>
        <legend>1. ¿Dónde estás?</legend>
        <div class="opciones">
          <label class="op"><input type="radio" name="lugar" value="cumple"> 🎂 Cumpleaños</label>
          <label class="op"><input type="radio" name="lugar" value="familia"> 👵 Reunión familiar</label>
          <label class="op"><input type="radio" name="lugar" value="cita"> 💔 Cita</label>
          <label class="op"><input type="radio" name="lugar" value="trabajo"> 💼 Trabajo</label>
          <label class="op"><input type="radio" name="lugar" value="clase"> 📚 Clase aburrida</label>
          <label class="op"><input type="radio" name="lugar" value="asado"> 🍖 Asado eterno</label>
          <label class="op"><input type="radio" name="lugar" value="consorcio"> 🏢 Reunión de consorcio</label>
          <label class="op"><input type="radio" name="lugar" value="sala"> 🩺 Sala de espera</label>
        </div>
      </fieldset>

      <label for="ganas" class="pregunta">2. ¿Cuántas ganas tenés de irte?</label>
      <input type="range" id="ganas" min="1" max="10" value="5">
      <p id="ganasTxt"></p>

      <fieldset>
        <legend>3. ¿Cuándo querés que suene?</legend>
        <div class="opciones tres">
          <label class="op"><input type="radio" name="demora" value="0" checked> Ya</label>
          <label class="op"><input type="radio" name="demora" value="5"> 5 s</label>
          <label class="op"><input type="radio" name="demora" value="10"> 10 s</label>
        </div>
      </fieldset>

      <label for="nombre" class="pregunta">¿Quién querés que te llame?</label>
      <input type="text" id="nombre" maxlength="20" placeholder="Opcional (ej.: Tía Rosa)" autocomplete="off">

      <label class="practica"><input type="checkbox" id="practica"> 🔊 Modo práctica (te leo también tus frases)</label>

      <button id="btnRescate" type="button">RESCATAME</button>
      <p id="aviso" role="alert"></p>
      <p id="historial" class="sub"></p>
      <p class="atajo">Atajo secreto: tecla R</p>
    </section>

    <!-- PANTALLA 2: LLAMADA FALSA -->
    <section id="llamada" aria-live="polite" hidden>
      <div id="avatar" aria-hidden="true"></div>
      <h2 id="quien"></h2>
      <p id="estado"></p>

      <article id="guion" hidden>
        <h3>📜 Tu guion de escape</h3>
        <div id="chat"></div>
        <div id="escape" hidden>
          <ol id="pasos"></ol>
          <p id="dato"></p>
        </div>
      </article>

      <div id="fin" hidden>
        <p id="mensajeFin"></p>
        <button id="btnVolver" type="button">← Volver</button>
      </div>

      <div id="entrante" class="botones">
        <button id="btnRechazar" class="circ rojo" type="button" aria-label="Rechazar llamada">📵</button>
        <button id="btnAtender" class="circ verde" type="button" aria-label="Atender llamada">📞</button>
      </div>
      <button id="btnCortar" class="circ rojo" type="button" aria-label="Cortar y huir" hidden>📵</button>
    </section>
  </main>

  <script src="rescate.js"></script>
  <script src="app.js"></script>
</body>
</html>
